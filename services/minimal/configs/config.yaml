components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 2
        fs-task-processor:
            worker_threads: 1
    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: 8080
                task_processor: main-task-processor
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: info
                    overflow_behavior: discard
        http-client: {}
        http-client-core:
            fs-task-processor: fs-task-processor
        dns-client:
            fs-task-processor: fs-task-processor
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
        testsuite-support: {}
        tests-control:
            load-enabled: $testsuite-enabled
            load-enabled#fallback: false
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
